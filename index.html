<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración de Locales · Godoy</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --chip:#0b1220;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--txt);font-size:15px}
  a{color:var(--accent)}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;background:var(--chip);
    color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
  .field{margin-bottom:12px}
  .btn{background:var(--accent2);color:#00131f;border:none;border-radius:8px;
    padding:9px 16px;font-weight:600}
  .btn:hover{background:var(--accent)}
  .btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
  .btn.sec:hover{border-color:var(--accent)}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
  .btn.sm{padding:5px 10px;font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}

  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
  #login .card{width:100%;max-width:380px}
  .brand{font-weight:700;font-size:20px;margin-bottom:2px}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:4px}

  /* App shell */
  #app{display:none}
  header.top{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:10px}
  nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
  nav.tabs button{background:transparent;border:none;color:var(--muted);
    padding:8px 14px;border-radius:8px;font-weight:600}
  nav.tabs button.active{background:var(--panel2);color:var(--txt)}
  main{padding:20px;max-width:1200px;margin:0 auto}
  h2.sec-title{margin:0 0 4px;font-size:20px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}

  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .kpi{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .kpi .card{padding:16px}
  .kpi .big{font-size:26px;font-weight:700;margin-top:6px}
  .kpi .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}

  .chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .chip.ocupado{background:rgba(34,197,94,.15);color:#4ade80}
  .chip.libre{background:rgba(148,163,184,.15);color:#cbd5e1}
  .chip.refaccion{background:rgba(245,158,11,.15);color:#fbbf24}
  .chip.pagado{background:rgba(34,197,94,.15);color:#4ade80}
  .chip.pendiente{background:rgba(239,68,68,.15);color:#f87171}
  .chip.parcial{background:rgba(245,158,11,.15);color:#fbbf24}
  .chip.activo{background:rgba(56,189,248,.15);color:#7dd3fc}
  .chip.finalizado{background:rgba(148,163,184,.15);color:#cbd5e1}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tr:hover td{background:var(--panel2)}
  .tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;gap:10px;flex-wrap:wrap}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.7);display:none;
    align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:540px;padding:22px}
  .modal h3{margin:0 0 16px}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

  .muted{color:var(--muted)}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:16px}
  .setup{background:rgba(245,158,11,.1);border:1px solid var(--warn);color:#fcd34d;
    padding:14px;border-radius:10px;margin:16px 0;font-size:14px}
  code{background:var(--chip);padding:2px 6px;border-radius:5px;font-size:13px}
  .actbtns{display:flex;gap:6px}
  .alertbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:16px;margin-bottom:20px}
  .alert-item{display:flex;justify-content:space-between;align-items:center;gap:12px;
    border-left:3px solid var(--accent);background:var(--panel2);border-radius:8px;
    padding:10px 12px;margin-bottom:8px}
  .alert-item:last-child{margin-bottom:0}
  .ok-box{background:rgba(34,197,94,.1);border:1px solid var(--ok);color:#86efac;
    padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:14px}
  .sumline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
  .sumline:last-child{border-bottom:none}

<script>
/* ============================ APP ============================ */
let sb = null;
const $ = (s)=>document.querySelector(s);
const money = (n,m)=> (m==='USD'?'US$ ':'$ ') + (Number(n)||0).toLocaleString('es-AR',{minimumFractionDigits:0});
const esc = (s)=> (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate = (d)=> d ? new Date(d+'T00:00:00').toLocaleDateString('es-AR') : '—';

// cache
let DATA = {locales:[], inquilinos:[], contratos:[], pagos:[], gastos:[], cuentas:[]};

/* ---------- Arranque ---------- */
// Limpia la URL: saca espacios, /rest/v1, /auth/v1 y barras finales.
function cleanUrl(u){
  return String(u||'').trim()
    .replace(/\/rest\/v1\/?$/,'')
    .replace(/\/auth\/v1\/?$/,'')
    .replace(/\/+$/,'');
}
const CLEAN_URL = cleanUrl(SUPABASE_URL);
function boot(){
  const ok = CLEAN_URL && !CLEAN_URL.includes('PEGAR') &&
             SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('PEGAR');
  if(!ok){ $('#setupWarn').style.display='block'; return; }
  sb = supabase.createClient(CLEAN_URL, SUPABASE_ANON_KEY.trim());
  sb.auth.getSession().then(({data})=>{ if(data.session) enterApp(); });
}
$('#btnLogin').onclick = async ()=>{
  $('#loginErr').textContent='';
  const email=$('#email').value.trim(), password=$('#pass').value;
  if(!sb){ $('#loginErr').textContent='Configurá Supabase primero.'; return; }
  try{
    const {error}= await sb.auth.signInWithPassword({email,password});
    if(error){
      $('#loginErr').textContent = (error.status?('['+error.status+'] '):'') + error.message;
      console.error('Login error', error, 'URL:', CLEAN_URL);
      return;
    }
    enterApp();
  }catch(e){
    $('#loginErr').textContent = 'Error de conexión: '+(e.message||e);
    console.error(e, 'URL:', CLEAN_URL);
  }
};
$('#pass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('#btnLogin').click(); });
$('#btnLogout').onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

async function enterApp(){
  $('#login').style.display='none';
  $('#app').style.display='block';
  await loadAll();
  render('dashboard');
  // Descarga los índices en segundo plano para actualizar el canon vigente
  precargarIndices();
}
async function precargarIndices(){
  const act=DATA.contratos.filter(c=>c.estado==='activo'&&c.fecha_inicio);
  if(!act.length) return;
  const desde=act.map(c=>c.fecha_inicio).sort()[0];
  const usaICL=act.some(c=>(c.ajuste_indice||'ICL')==='ICL');
  const usaIPC=act.some(c=>c.ajuste_indice==='IPC');
  try{ if(usaICL && !SERIES.ICL) SERIES.ICL=await fetchICL(addMonthsISO(desde,-2)); }catch(e){}
  try{ if(usaIPC && !SERIES.IPC) SERIES.IPC=await fetchIPC(); }catch(e){}
  const tab=document.querySelector('#tabs button.active');
  if(tab) render(tab.dataset.tab);
}
document.querySelectorAll('#tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    render(b.dataset.tab);
  };
});

/* ---------- Datos ---------- */
async function loadAll(){
  const [lo,inq,con,pa,ga,cu] = await Promise.all([
    sb.from('locales').select('*').order('id'),
    sb.from('inquilinos').select('*').order('nombre'),
    sb.from('contratos').select('*').order('id',{ascending:false}),
    sb.from('pagos').select('*').order('periodo',{ascending:false}),
    sb.from('gastos').select('*').order('fecha',{ascending:false}),
    sb.from('cuentas_servicio').select('*').order('tipo').order('id'),
  ]);
  DATA = {
    locales:lo.data||[], inquilinos:inq.data||[], contratos:con.data||[],
    pagos:pa.data||[], gastos:ga.data||[], cuentas:cu.data||[]
  };
}
/* ===================== MOTOR DE CÁLCULO (canon, alertas, mora) ===================== */
const HOY = ()=> new Date().toISOString().slice(0,10);
const diffDias=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);

// Canon vigente hoy: aplica los ajustes ya cumplidos desde el inicio del contrato.
// Con ICL usa la serie oficial del BCRA si está descargada; si no, informa que falta.
function canonVigente(c){
  const base=Number(c.monto_alquiler)||0;
  const res={monto:base, ajustes:0, proximo:null, fuente:'contrato', pendiente:false};
  if(!c.fecha_inicio) return res;
  const frec=Math.max(1,parseInt(c.ajuste_periodo)||4);
  const hoy=HOY();
  // fechas de ajuste ya cumplidas
  let f=addMonthsISO(c.fecha_inicio,frec), prev=c.fecha_inicio, monto=base, n=0;
  const idx=c.ajuste_indice||'ICL';
  while(f<=hoy){
    let factor=null;
    if(idx==='FIJO' && c.ajuste_porcentaje) factor=1+Number(c.ajuste_porcentaje)/100;
    else if(idx==='ICL' && SERIES.ICL){
      const a=iclAt(SERIES.ICL,prev), b=iclAt(SERIES.ICL,f);
      if(a&&b) factor=b/a;
    } else if(idx==='IPC' && SERIES.IPC){
      factor=1;
      for(const m of monthsBetween(prev,f)){
        const d=SERIES.IPC.find(x=>x.mes===m);
        if(d) factor*=1+d.valor/100; else { res.pendiente=true; }
      }
    }
    if(factor===null){ res.pendiente=true; }
    else { monto*=factor; n++; res.fuente=(idx==='FIJO'?'% fijo del contrato':idx+' oficial'); }
    prev=f; f=addMonthsISO(f,frec);
  }
  res.monto=monto; res.ajustes=n; res.proximo=f;
  return res;
}

// Estado de pago del mes en curso
function estadoAlquiler(c){
  const hoy=HOY(), dia=new Date().getUTCDate();
  const per=hoy.slice(0,7);
  const pago=(DATA.pagos||[]).find(p=>p.contrato_id==c.id && p.periodo===per && p.estado==='pagado');
  const gracia=parseInt(c.dia_gracia)||10;
  const venc=parseInt(c.dia_vencimiento)||1;
  if(pago) return {estado:'pagado', dias:0, msg:'Alquiler de '+per+' cobrado.'};
  if(dia<venc)   return {estado:'porvencer', dias:venc-dia, msg:`Vence en ${venc-dia} día(s).`};
  if(dia<=gracia)return {estado:'gracia', dias:gracia-dia,
    msg:`En período de gracia: puede pagar sin recargo hasta el día ${gracia} (quedan ${gracia-dia+1} día(s)).`};
  return {estado:'mora', dias:dia-venc,
    msg:`En mora desde el día ${venc}. Lleva ${dia-venc} día(s) de atraso.`};
}

/* Intereses por mora — cláusula 8ª:
   · Punitorio: % diario simple sobre el capital (0,3% diario por defecto).
   · Moratorio: tasa activa del Banco Nación (anual), proporcional a los días.
   · Capitalización cada 6 meses (art. 770 CCyC).
   Se muestran por separado y sumados. */
function calcMora(capital, dias, punitDiario, tasaAnual, capMeses){
  capital=Number(capital)||0; dias=Math.max(0,dias|0);
  const pd=Number(punitDiario)||0, ta=Number(tasaAnual)||0;
  const capDias=Math.max(1,Math.round((Number(capMeses)||6)*30.4167));
  let cap=capital, punit=0, morat=0, restante=dias;
  while(restante>0){
    const tramo=Math.min(restante,capDias);
    const p=cap*(pd/100)*tramo;
    const m=cap*(ta/100)*(tramo/365);
    punit+=p; morat+=m; cap+=p+m;      // capitalización al cierre del tramo
    restante-=tramo;
  }
  return {punitorio:punit, moratorio:morat, total:punit+morat, deuda:capital+punit+morat, dias};
}

const localName = id => (DATA.locales.find(l=>l.id==id)||{}).nombre || '—';
const inqName   = id => (DATA.inquilinos.find(i=>i.id==id)||{}).nombre || '—';
function contratoLabel(c){
  return `${localName(c.local_id)} · ${inqName(c.inquilino_id)}`;
}

/* ============================ VISTAS ============================ */
function render(tab){
  const v=$('#view');
  if(tab==='dashboard') return v.innerHTML = viewDashboard();
  if(tab==='locales')    return v.innerHTML = viewLocales();
  if(tab==='inquilinos') return v.innerHTML = viewInquilinos();
  if(tab==='contratos')  return v.innerHTML = viewContratos();
  if(tab==='pagos')      return v.innerHTML = viewPagos();
  if(tab==='gastos')     return v.innerHTML = viewGastos();
  if(tab==='cuentas')    return v.innerHTML = viewCuentas();
}

/* ---- Panel de alertas ---- */
function alertas(){
  const out=[], hoy=HOY();
  const activos=DATA.contratos.filter(c=>c.estado==='activo');

  for(const c of activos){
    const et=estadoAlquiler(c), v=canonVigente(c);
    const quien=`${localName(c.local_id)} · ${inqName(c.inquilino_id)}`;
    if(et.estado==='mora'){
      const m=calcMora(v.monto, et.dias, c.punitorio_diario, c.tasa_bna_anual, c.capitaliza_meses);
      out.push({n:3,t:'Alquiler en mora',d:`${quien}: ${et.msg} Deuda estimada ${money(m.deuda,c.moneda)} (capital ${money(v.monto,c.moneda)} + intereses ${money(m.total,c.moneda)}).`,
        b:`<button class="btn sec sm" onclick="openMora(${c.id})">Ver cálculo</button>`});
    } else if(et.estado==='gracia'){
      out.push({n:2,t:'Alquiler pendiente',d:`${quien}: ${et.msg} Monto ${money(v.monto,c.moneda)}.`});
    } else if(et.estado==='porvencer' && et.dias<=5){
      out.push({n:1,t:'Alquiler próximo a vencer',d:`${quien}: ${et.msg} Monto ${money(v.monto,c.moneda)}.`});
    }
    // próximo ajuste del canon
    if(v.proximo){
      const d=diffDias(hoy,v.proximo);
      if(d>=0 && d<=30) out.push({n:1,t:'Ajuste de alquiler próximo',
        d:`${quien}: corresponde actualizar por ${idxLabel(c.ajuste_indice)} el ${fdate(v.proximo)} (en ${d} día(s)).`});
    }
    // vencimiento del contrato
    if(c.fecha_fin){
      const d=diffDias(hoy,c.fecha_fin);
      if(d>=0 && d<=90) out.push({n:2,t:'Vencimiento de contrato',
        d:`${quien}: el contrato vence el ${fdate(c.fecha_fin)} (en ${d} día(s)). Inspección prevista entre 45 y 15 días antes.`});
    }
  }

  // servicios a cargo del inquilino sin acreditar
  const gp=DATA.gastos.filter(g=>g.estado==='pendiente');
  for(const g of gp){
    const d=g.fecha?diffDias(g.fecha,hoy):0;
    out.push({n:d>30?3:2,t:'Servicio impago',
      d:`${esc(g.categoria)}${g.local_id?' · '+localName(g.local_id):' · edificio'}: ${money(g.monto,g.moneda)} sin pagar${g.fecha?`, vencido hace ${d} día(s)`:''}.${d>30?' Supera los 30 días para acreditar el pago (cláusula 5ª).':''}`});
  }

  // medidores con deuda
  const md=(DATA.cuentas||[]).filter(c=>c.con_deuda);
  if(md.length) out.push({n:2,t:'Medidores con deuda',
    d:`${md.length} suministro(s) retirado(s) con deuda pendiente de resolución. Ver pestaña Servicios.`});

  return out.sort((a,b)=>b.n-a.n);
}
function panelAlertas(){
  const A=alertas();
  if(!A.length) return `<div class="ok-box">✅ Sin alertas. Los alquileres y servicios están al día.</div>`;
  const col=n=>n>=3?'var(--bad)':(n===2?'var(--warn)':'var(--accent)');
  const ico=n=>n>=3?'🔴':(n===2?'🟠':'🔵');
  return `<div class="alertbox">
    <div style="font-weight:700;margin-bottom:10px">Alertas (${A.length})</div>
    ${A.map(a=>`<div class="alert-item" style="border-left-color:${col(a.n)}">
      <div><strong>${ico(a.n)} ${esc(a.t)}</strong><div class="muted" style="font-size:13px;margin-top:2px">${a.d}</div></div>
      ${a.b||''}
    </div>`).join('')}
  </div>`;
}

/* ---- Dashboard ---- */
function viewDashboard(){
  const L=DATA.locales;
  const ocup=L.filter(l=>l.estado==='ocupado').length;
  const libre=L.filter(l=>l.estado==='libre').length;
  const refa=L.filter(l=>l.estado==='refaccion').length;

  // ingreso mensual esperado, con el canon YA ACTUALIZADO a hoy
  const activos=DATA.contratos.filter(c=>c.estado==='activo');
  const vig=new Map(activos.map(c=>[c.id,canonVigente(c)]));
  const ingARS=activos.filter(c=>c.moneda==='ARS').reduce((s,c)=>s+vig.get(c.id).monto,0);
  const ingUSD=activos.filter(c=>c.moneda==='USD').reduce((s,c)=>s+vig.get(c.id).monto,0);

  // pagos pendientes
  const pend=DATA.pagos.filter(p=>p.estado!=='pagado');

  // gastos del mes actual
  const ym=new Date().toISOString().slice(0,7);
  const gm=DATA.gastos.filter(g=>(g.fecha||'').slice(0,7)===ym);
  const gARS=gm.filter(g=>g.moneda==='ARS').reduce((s,g)=>s+Number(g.monto||0),0);
  const gUSD=gm.filter(g=>g.moneda==='USD').reduce((s,g)=>s+Number(g.monto||0),0);

  const locCards = L.map(l=>{

  return `

    <p class="sub">Estado general de los 3 locales del edificio · ${new Date().toLocaleDateString('es-AR')}</p>
    ${panelAlertas()}

      <div class="card"><div class="lbl">Alquiler actualizado hoy</div><div class="big">${money(ingARS,'ARS')}</div>
        ${baseARS&&Math.round(ingARS)!==Math.round(baseARS)?`<div class="muted" style="font-size:11px">base contrato ${money(baseARS,'ARS')} · +${(((ingARS/baseARS)-1)*100).toFixed(1)}%</div>`:''}
        ${ingUSD?`<div class="muted">+ ${money(ingUSD,'USD')}</div>`:''}</div>
      <div class="card"><div class="lbl">Pagos pendientes</div><div class="big" style="color:${pend.length?'var(--bad)':'var(--ok)'}">${pend.length}</div></div>

/* ---- Locales ---- */
/* Último gasto registrado de un servicio general del edificio (OSSE / Municipalidad).
   Se prorratea en partes iguales entre los 3 locales. */
function ultimoGastoGeneral(regex){
  const g=DATA.gastos
    .filter(x=>!x.local_id && (regex.test(x.categoria||'') || regex.test(x.descripcion||'')))
    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
  return g[0]||null;
}
function viewLocales(){
  const nLoc=Math.max(1,DATA.locales.length);
  const gOsse=ultimoGastoGeneral(/agua|osse/i);
  const gMuni=ultimoGastoGeneral(/municip|tasa/i);
  const terceroOsse=(gOsse?Number(gOsse.monto):0)/nLoc;
  const terceroMuni=(gMuni?Number(gMuni.monto):0)/nLoc;
  const ctaOsse=(DATA.cuentas||[]).find(c=>c.tipo==='agua');
  const ctaMuni=(DATA.cuentas||[]).find(c=>c.tipo==='impuesto'&&/municip/i.test(c.organismo));

  const rows=DATA.locales.map(l=>{
    const ener=(DATA.cuentas||[]).find(c=>c.tipo==='energia'&&c.local_id==l.id&&c.estado==='activo');
    const enerDeuda=(DATA.cuentas||[]).filter(c=>c.tipo==='energia'&&c.local_id==l.id&&c.con_deuda);
    const con=DATA.contratos.find(c=>c.local_id==l.id&&c.estado==='activo');
    return `<tr>
      <td><strong>${esc(l.nombre)}</strong>
        <div class="muted" style="font-size:11px">${esc(l.descripcion||'')}</div>
        ${con?`<div class="muted" style="font-size:11px">${esc(inqName(con.inquilino_id))}</div>`:''}</td>
      <td><span class="chip ${l.estado}">${l.estado}</span>
        ${enerDeuda.length?`<div><span class="chip pendiente" style="margin-top:4px">${enerDeuda.length} medidor(es) c/deuda</span></div>`:''}</td>
      <td>${ener?`${esc(ener.organismo)}<div style="font-family:ui-monospace,monospace;font-size:13px">${esc(ener.nro_cuenta)}</div>
            <div class="muted" style="font-size:11px">Titular: ${esc(ener.titular||'—')}</div>`
          :'<span class="muted">Sin suministro asignado</span>'}</td>
      <td>${gOsse?`<strong>${money(terceroOsse,gOsse.moneda)}</strong><div class="muted" style="font-size:11px">1/${nLoc} de ${money(gOsse.monto,gOsse.moneda)} · ${fdate(gOsse.fecha)}</div>`
          :'<span class="muted">Sin factura cargada</span>'}</td>
      <td>${gMuni?`<strong>${money(terceroMuni,gMuni.moneda)}</strong><div class="muted" style="font-size:11px">1/${nLoc} de ${money(gMuni.monto,gMuni.moneda)} · ${fdate(gMuni.fecha)}</div>`
          :'<span class="muted">Sin factura cargada</span>'}</td>
      <td class="actbtns">
        <button class="btn sec sm" onclick="openLocal(${l.id})">Editar</button>
      </td>
    </tr>`;}).join('');

  return `
    <div class="toolbar">
      <div><h2 class="sec-title">Locales</h2><p class="sub" style="margin:0">Ocupación, suministro de energía asignado y prorrateo de servicios comunes.</p></div>
      <button class="btn" onclick="openLocal()">+ Nuevo local</button>
    </div>
    <div class="tbl-wrap">
      <table><thead><tr>
        <th>Local</th><th>Estado</th><th>Energía (medidor activo)</th>
        <th>Agua OSSE (1/${nLoc})</th><th>Municipalidad (1/${nLoc})</th><th></th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="6" class="empty">Sin locales</td></tr>'}</tbody></table>
    </div>
    <div class="card" style="margin-top:16px">
      <strong style="font-size:14px">Cómo se calcula el prorrateo</strong>
      <p class="muted" style="font-size:13px;margin:8px 0 0">
        OSSE (cuenta ${esc(ctaOsse?ctaOsse.nro_cuenta:'—')}) y Municipalidad de Rawson
        (cuenta ${esc(ctaMuni?ctaMuni.nro_cuenta:'—')}) facturan el inmueble completo,
        así que a cada local le corresponde <strong>1/${nLoc}</strong> del importe.
        La app toma la última factura cargada en <em>Gastos</em> como gasto general
        (sin local asignado) y la divide entre ${nLoc}. Cargá cada factura nueva en
        Gastos para que estos valores se actualicen.
        ${(!gOsse||!gMuni)?'<br><br>⚠️ Faltan cargar facturas: '+[!gOsse?'OSSE':null,!gMuni?'Municipalidad':null].filter(Boolean).join(' y ')+'.':''}

/* ============================ MODAL / FORMS ============================ */
let onSave=null;
function openModal(title, bodyHtml, saveFn, opts){
  opts=opts||{};
  $('#modalTitle').textContent=title;
  $('#modalBody').innerHTML=bodyHtml;
  $('#modalErr').textContent='';
  onSave=saveFn;
  $('#modalSave').style.display = opts.hideSave ? 'none' : '';
  $('#modalCancel').textContent = opts.hideSave ? 'Cerrar' : 'Cancelar';
  $('#modalBg').classList.add('show');
}
function closeModal(){
  $('#modalBg').classList.remove('show'); onSave=null;
  $('#modalSave').style.display=''; $('#modalCancel').textContent='Cancelar';
}
$('#modalCancel').onclick=closeModal;
$('#modalBg').onclick=(e)=>{ if(e.target===$('#modalBg')) closeModal(); };
$('#modalSave').onclick=async ()=>{
  if(!onSave) return;
  try{
    $('#modalSave').disabled=true;
    await onSave();
    $('#modalSave').disabled=false;
    closeModal();
    await loadAll();
    render(document.querySelector('#tabs button.active').dataset.tab);
  }catch(err){
    $('#modalSave').disabled=false;
    $('#modalErr').textContent = err.message||String(err);
  }
};
const val=(id)=>{ const el=document.getElementById(id); return el?el.value:''; };
const numOrNull=(v)=> v===''?null:Number(v);

function selOptions(arr, sel, blank){
  return (blank?`<option value="">${blank}</option>`:'') +
    arr.map(o=>`<option value="${o.v}" ${o.v==sel?'selected':''}>${esc(o.t)}</option>`).join('');
}
const monedaSel=(sel)=>selOptions([{v:'ARS',t:'Pesos (ARS)'},{v:'USD',t:'Dólares (USD)'}],sel||'ARS');
const estadoLocalSel=(sel)=>selOptions([{v:'ocupado',t:'Ocupado'},{v:'libre',t:'Libre'},{v:'refaccion',t:'En refacción'}],sel||'libre');

/* ============================ PROYECCIÓN DE INCREMENTOS ============================ */
/*
  Métodos de cálculo (fuentes oficiales):
  · ICL (BCRA): índice diario que combina 50% IPC y 50% RIPTE (salarios).
    Nuevo alquiler = alquiler vigente × (ICL fecha de ajuste ÷ ICL ajuste anterior).
    Datos: API BCRA, serie idVariable 40.
  · IPC (INDEC): inflación mensual. Factor del período = producto de
    (1 + inflación_mes/100) de cada mes entre ajustes. Datos: API ArgentinaDatos.
  · Casa Propia: coeficiente mensual (menor entre promedio 12m de variación
    salarial CVS con aforo 0,9 y promedio 12m de inflación/CER). Factor del
    período = producto de los coeficientes mensuales. No tiene API pública:
    se estima con un % mensual o se cargan los coeficientes publicados en
    argentina.gob.ar.
  · Porcentaje fijo: factor = 1 + %/100 en cada ajuste.
*/
const idxLabel=(i)=>({ICL:'ICL',IPC:'IPC',CASA_PROPIA:'Casa Propia',FIJO:'% fijo',NINGUNO:'—'}[i]||'—');
let SERIES={ICL:null,IPC:null}; // cache de series descargadas

async function fetchICL(desde){
  // Serie diaria ICL del BCRA (idVariable 40)
  const hasta=new Date().toISOString().slice(0,10);
  const url=`https://api.bcra.gob.ar/estadisticas/v3.0/monetarias/40?desde=${desde}&hasta=${hasta}&limit=3000`;
  const r=await fetch(url); if(!r.ok) throw new Error('BCRA HTTP '+r.status);
  const j=await r.json();
  const arr=(j.results||[]).map(x=>({fecha:x.fecha,valor:Number(x.valor)}))
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!arr.length) throw new Error('BCRA sin datos');
  return arr;
}
async function fetchIPC(){
  // Inflación mensual (INDEC, vía ArgentinaDatos)
  const r=await fetch('https://api.argentinadatos.com/v1/finanzas/indices/inflacion');
  if(!r.ok) throw new Error('ArgentinaDatos HTTP '+r.status);
  const j=await r.json();
  const arr=(j||[]).map(x=>({mes:String(x.fecha).slice(0,7),valor:Number(x.valor)}))
    .sort((a,b)=>a.mes.localeCompare(b.mes));
  if(!arr.length) throw new Error('sin datos IPC');
  return arr;
}
const iclAt=(serie,fecha)=>{ let v=null; for(const p of serie){ if(p.fecha<=fecha) v=p.valor; else break; } return v; };
function addMonthsISO(iso,m){
  const [y,mo,d]=iso.split('-').map(Number);
  const dt=new Date(Date.UTC(y,mo-1+m,1));
  const last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();
  dt.setUTCDate(Math.min(d,last));
  return dt.toISOString().slice(0,10);
}
// meses 'YYYY-MM' del intervalo (exclusivo el mes de 'desde', inclusivo el de 'hasta')
function monthsBetween(desde,hasta){
  const out=[]; let m=desde.slice(0,7);
  while(m<hasta.slice(0,7)){
    const [y,mm]=m.split('-').map(Number);
    m=(mm===12?(y+1)+'-01':y+'-'+String(mm+1).padStart(2,'0'));
    out.push(m);
  }
  return out;
}

window.openProyeccion=(id)=>{
  const c=DATA.contratos.find(x=>x.id==id); if(!c) return;
  if(!c.fecha_inicio){ alert('El contrato no tiene fecha de inicio.'); return; }
  const idxOpts=[
    {v:'ICL',t:'ICL (BCRA · automático)'},
    {v:'IPC',t:'IPC (INDEC · automático)'},
    {v:'CASA_PROPIA',t:'Casa Propia (estimado)'},
    {v:'FIJO',t:'Porcentaje fijo'}
  ];
  const idx0 = (c.ajuste_indice && c.ajuste_indice!=='NINGUNO') ? c.ajuste_indice : 'ICL';
  openModal('Proyección · '+contratoLabel(c),`
    <div class="row">
      <div class="field"><label>Índice</label><select id="p_idx">${selOptions(idxOpts,idx0)}</select></div>
      <div class="field"><label>Frecuencia (meses)</label><input id="p_frec" type="number" min="1" max="12" value="${esc(parseInt(c.ajuste_periodo)||3)}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Horizonte (meses)</label><input id="p_hor" type="number" min="3" max="60" value="24"></div>
      <div class="field"><label>Estimación futura (% mensual)</label><input id="p_est" type="number" step="0.1" value="${esc(c.ajuste_indice==='FIJO'&&c.ajuste_porcentaje?c.ajuste_porcentaje:2)}"></div>
    </div>
    <p class="muted" id="p_info" style="font-size:12px;margin:4px 0 10px"></p>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px">
      <button class="btn sec sm" id="p_calc" type="button">Calcular proyección</button>
      <span class="muted" id="p_status" style="font-size:12px"></span>
    </div>
    <div id="p_out"></div>
  `, null, {hideSave:true});

  const info={
    ICL:'ICL = 50% inflación (IPC) + 50% salarios (RIPTE). Se descarga la serie oficial diaria del BCRA. Ajuste = ICL fecha de ajuste ÷ ICL del ajuste anterior. Los tramos futuros se estiman con el % mensual indicado (precargado con el promedio reciente del índice).',
    IPC:'Se descarga la inflación mensual oficial (INDEC). Ajuste = producto de (1 + inflación de cada mes) del período. Los meses futuros usan el % mensual estimado.',
    CASA_PROPIA:'Casa Propia toma el menor entre el promedio 12 meses de la variación salarial (CVS, con aforo del 90%) y el promedio 12 meses de inflación. Suele dar levemente menos que el IPC. No tiene API pública: la proyección usa el % mensual estimado. Coeficientes oficiales: argentina.gob.ar → Casa Propia.',
    FIJO:'Cada ajuste aplica el porcentaje indicado en "Estimación futura": nuevo alquiler = vigente × (1 + %/100).'
  };
  const setInfo=()=>{ document.getElementById('p_info').textContent = info[val('p_idx')]||''; };
  document.getElementById('p_idx').onchange=setInfo; setInfo();

  document.getElementById('p_calc').onclick=async ()=>{
    const st=document.getElementById('p_status'), out=document.getElementById('p_out');
    const tipo=val('p_idx');
    const frec=Math.max(1,parseInt(val('p_frec'))||3);
    const hor=Math.max(3,parseInt(val('p_hor'))||24);
    let est=Number(val('p_est'));
    out.innerHTML=''; st.textContent='Calculando…';
    const hoy=new Date().toISOString().slice(0,10);
    let fuente='estimación manual';

    try{
      if(tipo==='ICL' && !SERIES.ICL){
        st.textContent='Descargando serie ICL del BCRA…';
        try{ SERIES.ICL=await fetchICL(addMonthsISO(c.fecha_inicio,-1)); fuente='BCRA (oficial) + estimación futura'; }
        catch(e){ st.textContent='No se pudo conectar al BCRA ('+e.message+'). Se usa solo la estimación mensual.'; }
      } else if(tipo==='ICL' && SERIES.ICL){ fuente='BCRA (oficial) + estimación futura'; }
      if(tipo==='IPC' && !SERIES.IPC){
        st.textContent='Descargando inflación mensual (INDEC)…';
        try{ SERIES.IPC=await fetchIPC(); fuente='INDEC vía ArgentinaDatos + estimación futura'; }
        catch(e){ st.textContent='No se pudo conectar a ArgentinaDatos ('+e.message+'). Se usa solo la estimación mensual.'; }
      } else if(tipo==='IPC' && SERIES.IPC){ fuente='INDEC vía ArgentinaDatos + estimación futura'; }

      // precargar estimación con promedio real reciente si hay datos
      if(tipo==='IPC' && SERIES.IPC && !document.getElementById('p_est').dataset.touched){
        const u=SERIES.IPC.slice(-3);
        est=Math.round((u.reduce((s,x)=>s+x.valor,0)/u.length)*10)/10;
        document.getElementById('p_est').value=est;
      }
      if(tipo==='ICL' && SERIES.ICL && !document.getElementById('p_est').dataset.touched){
        const s=SERIES.ICL, a=iclAt(s,addMonthsISO(hoy,-3)), b=s[s.length-1].valor;
        if(a){ est=Math.round((Math.pow(b/a,1/3)-1)*1000)/10; document.getElementById('p_est').value=est; }
      }

      // fechas de ajuste desde el inicio hasta inicio+horizonte
      const fin=addMonthsISO(c.fecha_inicio,hor);
      const fechas=[]; let f=addMonthsISO(c.fecha_inicio,frec);
      while(f<=fin){ fechas.push(f); f=addMonthsISO(f,frec); }

      let monto=Number(c.monto_alquiler)||0, prev=c.fecha_inicio;
      const rows=[[fdate(c.fecha_inicio),'—',money(monto,c.moneda)+' (inicial)','']];
      for(const fecha of fechas){
        let factor=null, nota='';
        if(tipo==='FIJO'){ factor=1+est/100; nota='% fijo'; }
        else if(tipo==='ICL' && SERIES.ICL){
          const a=iclAt(SERIES.ICL,prev), b=iclAt(SERIES.ICL,fecha);
          if(a&&b&&fecha<=hoy){ factor=b/a; nota='dato oficial'; }
          else if(a&&fecha>hoy){
            const ult=SERIES.ICL[SERIES.ICL.length-1];
            const base=(prev<=ult.fecha)?(ult.valor/iclAt(SERIES.ICL,prev)):1;
            const mesesRest=Math.max(0,monthsBetween(prev<=ult.fecha?ult.fecha:prev,fecha).length);
            factor=base*Math.pow(1+est/100,mesesRest); nota='estimado';
          }
        }
        else if(tipo==='IPC' && SERIES.IPC){
          factor=1; nota='dato oficial';
          for(const m of monthsBetween(prev,fecha)){
            const d=SERIES.IPC.find(x=>x.mes===m);
            if(d) factor*=1+d.valor/100;
            else { factor*=1+est/100; nota='parcialmente estimado'; }
          }
        }
        if(factor===null){ factor=Math.pow(1+est/100,frec); nota='estimado'; }
        monto*=factor;
        rows.push([fdate(fecha),'+'+((factor-1)*100).toFixed(1)+'%',money(monto,c.moneda),nota]);
        prev=fecha;
      }
      st.textContent='Fuente: '+fuente;
      out.innerHTML=`<div class="tbl-wrap"><table>
        <thead><tr><th>Fecha de ajuste</th><th>Incremento</th><th>Alquiler</th><th>Origen</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><strong>${r[2]}</strong></td><td class="muted">${r[3]}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="muted" style="font-size:11px;margin-top:8px">Los valores futuros son proyecciones estimadas, no valores oficiales. Verificá el índice del día del ajuste en la fuente oficial (BCRA / INDEC / argentina.gob.ar).</p>`;
    }catch(e){ st.textContent='Error: '+(e.message||e); }
  };
  document.getElementById('p_est').oninput=function(){ this.dataset.touched='1'; };
};

/* ---- Borrar ---- */
window.delRow=async (table,id)=>{
  if(!confirm('¿Borrar este registro? Esta acción no se puede deshacer.')) return;
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error){ alert(error.message); return; }
  await loadAll();
  render(document.querySelector('#tabs button.active').dataset.tab);
};

boot();
</script>
